name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint and typecheck
        run: npm run lint:check

      - name: Test
        run: npm test

      - name: Desktop navigation and IPC policy
        run: node --test desktop/navigation-policy.node-test.cjs

  backend:
    name: Backend test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Ledger periodic confirmation race contracts
        run: go test -race ./pkg/services -run 'TestPeriodicLedger|TestScheduledOccurrence' -count=1

  android:
    name: Android validation
    uses: ./.github/workflows/android.yml

  quality-gate:
    name: Quality gate
    if: always()
    needs: [frontend, backend, android]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        run: |
          test "${{ needs.frontend.result }}" = "success"
          test "${{ needs.backend.result }}" = "success"
          test "${{ needs.android.result }}" = "success"
