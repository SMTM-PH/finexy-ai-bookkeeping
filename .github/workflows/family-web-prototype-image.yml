name: Family web prototype image

on:
  push:
    branches:
      - codex/family-web-prototype
    paths:
      - "docs/prototypes/family-web/**"
      - ".github/workflows/family-web-prototype-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: family-web-prototype-image
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/smtm-ph/finexy-family-web-prototype

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for verification
        uses: docker/build-push-action@v6
        with:
          context: docs/prototypes/family-web
          load: true
          tags: family-web-prototype:test
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Finexy family bookkeeping interactive web prototype

      - name: Verify container and security headers
        shell: bash
        run: |
          docker run -d --rm --name family-web-prototype-test -p 18088:8080 family-web-prototype:test
          trap 'docker stop family-web-prototype-test >/dev/null 2>&1 || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:18088/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:18088/ | grep -F "家庭账本设计原型"
          curl --fail --silent --show-error --head http://127.0.0.1:18088/ | grep -i "content-security-policy"
          test "$(docker inspect --format='{{.State.Health.Status}}' family-web-prototype-test)" != "unhealthy"

      - name: Publish verified image
        uses: docker/build-push-action@v6
        with:
          context: docs/prototypes/family-web
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:prototype
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Finexy family bookkeeping interactive web prototype
