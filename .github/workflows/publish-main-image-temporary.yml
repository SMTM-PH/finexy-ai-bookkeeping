name: Publish main Docker image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-main-image-temporary.yml
      - .dockerignore
      - Dockerfile
      - go.mod
      - go.sum
      - package.json
      - package-lock.json
      - vite.config.ts
      - .github/scripts/verify-release-web.mjs
      - .github/scripts/verify-agent-access.mjs
      - cmd/**
      - conf/**
      - docker/**
      - pkg/**
      - public/**
      - src/**
      - templates/**

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Read release version
        id: release
        run: echo "version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.FINEXY_PUBLISH_DOCKERHUB_USERNAME }}
          password: ${{ secrets.FINEXY_PUBLISH_DOCKERHUB_TOKEN }}
      - name: Build the main image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: |
            ph97/finexy-bookkeeping:${{ steps.release.outputs.version }}-amd64
          build-args: |
            RELEASE_BUILD=true
            SKIP_TESTS=true
      - name: Verify application and embedded prototype
        shell: bash
        run: |
          docker run -d --rm --name finexy-main-image-test -p 18089:8080 ph97/finexy-bookkeeping:${{ steps.release.outputs.version }}-amd64
          trap 'docker stop finexy-main-image-test >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18089/healthz.json >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18089/healthz.json | jq -e '.success == true and .result.version == "${{ steps.release.outputs.version }}"'
          docker exec finexy-main-image-test test -f /ezbookkeeping/public/prototypes/family-web/index.html
          curl --fail --silent --location http://127.0.0.1:18089/prototypes/family-web/index.html | grep -F "家庭账本设计原型"
          npm install --prefix "$RUNNER_TEMP/finexy-browser" --no-package-lock playwright
          "$RUNNER_TEMP/finexy-browser/node_modules/.bin/playwright" install --with-deps chromium
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/finexy-browser/node_modules/playwright/index.mjs" node .github/scripts/verify-release-web.mjs
      - name: Verify Agent permissions and ledger imports before publishing
        shell: bash
        run: |
          docker run -d --rm --name finexy-agent-e2e -p 18110:8080 -e EBK_AUTH_ENABLE_REGISTER=true -e EBK_SECURITY_ENABLE_API_TOKEN=true -e EBK_MCP_ENABLE_MCP=true -e EBK_SERVER_ROOT_URL=http://127.0.0.1:18110/ ph97/finexy-bookkeeping:${{ steps.release.outputs.version }}-amd64
          trap 'docker stop finexy-agent-e2e >/dev/null 2>&1 || true' EXIT
          FINEXY_EXPECTED_VERSION="${{ steps.release.outputs.version }}" PLAYWRIGHT_MODULE="$RUNNER_TEMP/finexy-browser/node_modules/playwright/index.mjs" PYTHON=python3 node .github/scripts/verify-agent-access.mjs
      - name: Publish latest AMD64 image
        shell: bash
        run: |
          docker tag ph97/finexy-bookkeeping:${{ steps.release.outputs.version }}-amd64 ph97/finexy-bookkeeping:latest-amd64
          docker push ph97/finexy-bookkeeping:${{ steps.release.outputs.version }}-amd64
          docker push ph97/finexy-bookkeeping:latest-amd64
