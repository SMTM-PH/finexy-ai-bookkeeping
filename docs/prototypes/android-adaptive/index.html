function transactions(){return rows.map((r,i)=>`<button class="transaction ${selected===i&&page===1?'selected':''}" data-row="${i}"><span class="badge">${icon(r[3])}</span><span class="meta"><strong>${r[0]}</strong><small>${r[1]}</small></span><b class="num ${i===2?'green':''}">${r[2]}</b></button>`).join('')}
function budget(){return '<div class="card"><div class="row"><h3>本月预算</h3><span class="pill">余量充足</span></div><div class="row"><b class="num">¥ 4,860.00</b><small>/ ¥ 10,000.00</small></div><div class="progress"><i></i></div><div class="row"><small>已使用 48.6%</small><small>剩余 ¥ 5,140.00</small></div></div>'}
function overview(){return `<div class="grid"><div class="stack"><section class="card wallet"><div class="row"><span>本月结余</span><span class="pill">人民币 CNY</span></div><div class="amount">¥ 13,640.00</div><small>每一笔记录，让生活更有余地。</small><div class="metrics"><div><small>本月收入</small><strong class="green">+ ¥ 18,500.00</strong></div><div><small>本月支出</small><strong>− ¥ 4,860.00</strong></div></div></section>${budget()}<section class="card"><div class="row"><h3>支出趋势</h3><small>近 7 日 · CNY</small></div><div class="chart" role="img" aria-label="近七日支出：120、85、268、48、150、96、44 元">${[45,32,100,18,56,36,16].map(h=>`<div class="bar" style="height:${h}%"></div>`).join('')}</div><div class="chart-label"><span>09.05</span><span>09.08</span><span>09.11</span></div></section></div><aside class="stack overview-side"><section class="card"><div class="row"><h3>待确认入账</h3><span class="pill">1 笔</span></div><p>音乐订阅 <b class="num" style="float:right">¥ 18.00</b></p><small>周期计划 · 今天到期<br>确认前不会计入支出。</small><button style="width:100%;margin-top:18px" data-action="review">查看并确认</button></section><section class="card"><div class="row"><h3>近期流水</h3><button data-page="1">全部</button></div>${transactions()}</section><small>个人账本 · 所有金额为原型演示数据</small></aside></div>`}
function ledger(){let r=rows[selected];return `<div class="grid ${detail?'show-detail':''}"><section class="card list-pane"><div class="filters">${['本月','全部类型','全部账户'].map(t=>`<button data-action="filter">${t}⌄</button>`).join('')}</div><div class="row"><h3>九月流水</h3><small>4 笔演示记录</small></div>${transactions()}<div class="divider"></div><small>选择一笔流水，在右侧查看完整信息。</small></section><section class="card detail detail-pane"><button class="back" data-action="back">${icon('back')}返回列表</button><div class="detail-icon">${icon(r[3])}</div><h3>${r[0]}</h3><div class="amount ${selected===2?'green':''}">${r[2]}</div><small>已同步 · ${selected===2?'收入':'支出'}</small><dl><div><dt>账户</dt><dd>${r[1].split(' · ')[1]}</dd></div><div><dt>分类</dt><dd>${r[1].split(' · ')[0]}</dd></div><div><dt>日期</dt><dd>2026年9月11日</dd></div><div><dt>标签</dt><dd><span class="pill">日常生活</span></dd></div><div><dt>备注</dt><dd>${selected===0?'工作日午餐':'暂无备注'}</dd></div></dl><button data-action="edit" style="width:100%">编辑流水</button></section></div>`}
function entry(){return `<div class="grid"><form class="card" id="entry"><div class="segments">${['支出','收入','转账','余额调整'].map(t=>`<button type="button" data-kind="${t}" class="${kind===t?'active':''}">${t}</button>`).join('')}</div>${kind==='转账'?`<div class="segments">${['账户间转账','转出','转入'].map(t=>`<button type="button" data-direction="${t}" class="${direction===t?'active':''}">${t}</button>`).join('')}</div>`:''}<label for="amount">${kind}金额 · CNY</label><input id="amount" class="form-amount" required type="number" min="0.01" step="0.01" value="${draft.amount}"><div class="field-grid">${kind!=='收入'&&!(kind==='转账'&&direction==='转入')?'<div><label>来源账户<select><option>招商银行 · 储蓄卡</option><option>微信零钱</option></select></label></div>':''}${kind==='收入'||kind==='转账'&&direction!=='转出'?'<div><label>目标账户<select><option>微信零钱</option><option>招商银行 · 储蓄卡</option></select></label></div>':''}${kind!=='余额调整'?'<div><label>分类<select><option>'+({支出:'餐饮',收入:'工资',转账:'日常转账'}[kind])+'</option></select></label></div>':'<div><label>调整方向<select><option>增加余额</option><option>减少余额</option></select></label></div>'}<div><label for="date">日期</label><input id="date" type="date" value="${draft.date}" required></div></div><label for="note">备注</label><input id="note" value="${draft.note}"><label>标签</label><button type="button" data-action="tag" aria-pressed="true">日常生活 ✓</button><div class="form-footer"><small>切换设备形态会保留草稿</small><button class="primary">保存${kind}</button></div></form><aside class="stack helper"><div class="card"><h3>从常用模板开始</h3><p class="muted">金额、账户与分类一起填好。</p><button class="transaction" data-action="template"><span class="badge">${icon('food')}</span><span>工作日午餐<small>餐饮 · ¥ 38.00</small></span></button></div><div class="card"><h3>录入提示</h3><p class="muted">${kind==='转账'?'转出只需来源账户；转入只需目标账户。账户间转账需选择两个不同账户。':'先确认金额和资金方向，再选择账户与分类。'}</p><small>原型保存仅显示交互反馈，不写入真实账本。</small></div></aside></div>`}
function accounts(){return `<div class="grid ${detail?'show-detail':''}"><section class="card list-pane"><h3>我的账户</h3>${['招商银行 · 储蓄卡','微信零钱','支付宝'].map((a,i)=>`<button class="transaction ${selected===i?'selected':''}" data-account="${i}"><span class="badge">${icon('wallet')}</span><span class="meta">${a}<small>${i===0?'默认账户':'日常支付'}</small></span><b>¥ ${['32,680.00','1,280.00','860.00'][i]}</b></button>`).join('')}</section><section class="stack detail-pane"><div class="card wallet"><button class="back" data-action="back">返回账户</button><p>${['招商银行 · 储蓄卡','微信零钱','支付宝'][selected%3]}</p><small>当前余额</small><div class="amount">¥ ${['32,680.00','1,280.00','860.00'][selected%3]}</div><button data-page="2" style="margin-top:22px">从此账户记账</button></div><div class="card"><h3>账户信息</h3><p>币种 <span style="float:right">人民币 CNY</span></p><p>用途 <span style="float:right">个人日常收支</span></p><small>大屏将账户选择与余额详情同时展示。</small></div></section></div>`}
function settings(){let groups=['用户偏好','预算设置','同步与冲突','安全与隐私'];return `<div class="grid ${detail?'show-detail':''}"><section class="card list-pane"><h3>个人设置</h3>${groups.map((g,i)=>`<button class="transaction ${setting===i?'selected':''}" data-setting="${i}">${icon('settings')}<span class="meta">${g}</span><span>›</span></button>`).join('')}</section><section class="card detail-pane"><button class="back" data-action="back">返回设置</button><h3>${groups[setting]}</h3>${setting===1?'<label>月度总预算<input type="number" value="10000"></label><p class="muted">用于每月支出总额提醒，不包含转账和余额调整。</p><button data-action="save" class="primary">保存预算</button>':setting===0?'<label>默认币种<select><option>人民币 CNY</option></select></label><label>主题<select id="app-theme"><option>浅色</option><option>深色</option></select></label><label>字体大小<select id="app-font"><option>标准</option><option>大字号</option></select></label>':setting===2?'<p>所有演示记录已同步</p><small>最近同步：今天 09:40</small><div class="divider"></div><button data-action="sync">手动同步</button>':'<p>应用锁</p><button data-action="lock" aria-pressed="false">启用应用锁</button><p class="muted">原型只展示开关反馈，不设置真实 PIN。</p>'}</section></div>`}
function render(){nav();$('content').innerHTML=`<header class="heading"><div><h2>${pages[page]}</h2><p class="muted">${['九月，给生活留一些余量。','每一笔收支，都有清晰的去向。','记下此刻，留住每一笔。','余额与账户，一目了然。','让 Finexy 更适合你的习惯。'][page]}</p></div>${page===0?'<button class="period" data-action="month">2026年9月⌄</button>':page===1?'<button class="primary" data-page="2">新增流水</button>':''}</header>`+[overview,ledger,entry,accounts,settings][page]()}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.page!==undefined){page=+b.dataset.page;detail=false;render()}if(b.dataset.row!==undefined){selected=+b.dataset.row;page=1;detail=true;render()}if(b.dataset.account!==undefined){selected=+b.dataset.account;detail=true;render()}if(b.dataset.setting!==undefined){setting=+b.dataset.setting;detail=true;render()}if(b.dataset.kind){kind=b.dataset.kind;render()}if(b.dataset.direction){direction=b.dataset.direction;render()}let a=b.dataset.action;if(a==='back'){detail=false;render()}else if(a==='edit'){page=2;draft.amount=rows[selected][2].replace(/[^0-9.]/g,'');draft.note=rows[selected][0];render()}else if(a==='template'){draft.amount='38.00';draft.note='工作日午餐';render();toast('已应用午餐模板')}else if(a==='tag'||a==='lock'){let on=b.getAttribute('aria-pressed')==='true';b.setAttribute('aria-pressed',!on);b.textContent=a==='tag'?(on?'添加日常生活标签':'日常生活 ✓'):(on?'启用应用锁':'应用锁已启用（演示）')}else if(a==='review')toast('待确认：音乐订阅 ¥ 18.00 · 原型未实际入账');else if(a)toast({save:'预算已保存（仅演示）',sync:'同步完成（演示）',month:'本原型展示 2026 年 9 月',filter:'本原型展示全部四笔演示流水'}[a]||'原型演示');if(b.dataset.device)setDevice(b.dataset.device)});
document.addEventListener('input',e=>{if(['amount','note','date'].includes(e.target.id))draft[e.target.id]=e.target.value});document.addEventListener('submit',e=>{e.preventDefault();toast(`已保存${kind} ¥ ${draft.amount}（仅演示）`)});
// Attach the current page to the content container for page-specific layouts.
function wideInsights(){return `<section class="wide-insights" aria-label="大屏财务工作区"><section class="card"><div class="row"><h3>九月计划日历</h3><span class="pill">4 项计划</span></div><p class="muted">查看日期，提前安排本月收支。</p><div class="calendar-days">${['一','二','三','四','五','六','日'].map(d=>`<span class="weekday">${d}</span>`).join('')}<span></span>${Array.from({length:30},(_,i)=>{let d=i+1,plans={5:'工资',11:'音乐订阅',15:'房租',22:'网络费'};return `<button data-day="${d}" class="${plans[d]?'has-plan':''}" aria-label="9月${d}日${plans[d]?'，'+plans[d]:''}">${d}<small>${plans[d]||'·'}</small></button>`}).join('')}</div><p id="plan-detail" style="margin-top:16px"><b>今天 · 9月11日</b><br><small>音乐订阅 ¥ 18.00 · 待确认</small></p></section><section class="card"><h3>支出花在哪里</h3><p class="muted">本月 ¥ 4,860.00 · 按分类</p>${[['居住','2,800.00',58],['餐饮','1,120.00',23],['购物','580.00',12],['交通','360.00',7]].map(([n,v,w])=>`<div class="category-line"><div class="row"><b>${n}</b><span class="num">¥ ${v}</span></div><div class="progress"><i style="width:${w}%"></i></div><small>占本月支出 ${w}%</small></div>`).join('')}<div class="divider"></div><small>房租是本月主要支出；餐饮仍在分类预算内。</small></section><section class="card wide-ledger"><div class="row"><h3>流水快速核对</h3><button data-page="1">完整流水</button></div><p class="muted">直接对照分类与账户，点击名称查看详情。</p><table class="wide-table"><thead><tr><th>项目 / 分类</th><th class="account-col">账户</th><th>金额</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td><button data-row="${i}">${r[0]}</button><small style="display:block">${r[1].split(' · ')[0]}</small></td><td class="account-col">${r[1].split(' · ')[1]}</td><td class="num ${i===2?'green':''}">${r[2]}</td></tr>`).join('')}</tbody></table><p><small>以上为四笔演示流水；月度汇总另含其他示例支出。</small></p></section></section>`}
const renderPage=render;render=function(){renderPage();$('content').dataset.page=String(page);if(page===0)$('content').querySelector('.grid').insertAdjacentHTML('beforeend',wideInsights())};
document.addEventListener('click',e=>{let b=e.target.closest('[data-day]');if(!b)return;let d=+b.dataset.day;const plans={5:['工资','¥ 18,500.00 · 已入账'],11:['音乐订阅','¥ 18.00 · 待确认'],15:['房租','¥ 2,800.00 · 尚未到期'],22:['网络费','¥ 99.00 · 尚未到期']};$('plan-detail').innerHTML=`<b>9月${d}日 · ${plans[d]?.[0]||'暂无计划'}</b><br><small>${plans[d]?.[1]||'当天没有周期收支安排。'}</small>`});
let deviceMode='tablet';
function updateLayout(){const width=$('device').clientWidth;const preference=$('nav-position').value;const side=preference==='auto'?(width<600?'bottom':'left'):preference;$('device').classList.remove('nav-left','nav-right','nav-bottom');$('device').classList.add('nav-'+side);const usable=$('content').clientWidth-parseFloat(getComputedStyle($('content')).paddingLeft)-parseFloat(getComputedStyle($('content')).paddingRight);$('caption').textContent={phone:'手机',portrait:'平板竖屏',tablet:'平板横屏',fold:'折叠展开',split:'分屏窗口'}[deviceMode]+' · 当前窗口 '+width+'px · '+{left:'左侧导航',right:'右侧导航',bottom:'底部导航'}[side]+' · 内容区 '+Math.round(usable)+'px。可用内容宽度 ≥620px 展示双栏；大字号优先单列。'}
function fitPreview(){const stage=document.querySelector('.stage');const scale=Math.min(1,(stage.clientWidth-8)/$('device').offsetWidth);$('device').style.zoom=scale;updateLayout();$('caption').textContent+=' · 预览缩放 '+Math.round(scale*100)+'%（保持设备逻辑宽度）'}
function setDevice(mode){deviceMode=mode;$('device').classList.remove('phone','portrait','fold','split');if(mode!=='tablet')$('device').classList.add(mode);document.querySelectorAll('[data-device]').forEach(b=>b.classList.toggle('active',b.dataset.device===mode));fitPreview()}
document.querySelector('.tools').insertAdjacentHTML('afterbegin','<label for="nav-position">导航位置<select id="nav-position"><option value="auto">自动适配</option><option value="left">左侧</option><option value="right">右侧</option><option value="bottom">底部</option></select></label>');$('nav-position').onchange=fitPreview;new ResizeObserver(fitPreview).observe(document.querySelector('.stage'));
$('theme').onclick=()=>{let dark=$('device').classList.toggle('dark');$('theme').textContent=dark?'浅色模式':'深色模式'};$('font').onclick=()=>{let large=$('device').classList.toggle('large');$('font').textContent=large?'标准字号':'大字号'};$('foldToggle').onclick=()=>setDevice($('device').classList.contains('fold')?'phone':'fold');document.addEventListener('change',e=>{if(e.target.id==='app-theme'){$('device').classList.toggle('dark',e.target.value==='深色');$('theme').textContent=e.target.value==='深色'?'浅色模式':'深色模式'}if(e.target.id==='app-font'){$('device').classList.toggle('large',e.target.value==='大字号')}});render();setDevice('tablet');
</script></html>
